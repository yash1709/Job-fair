name: discover new company boards

# Keeps companies.json growing: a YC company with no jobs today might open a board next month, and
# the live app only ever re-checks boards already in companies.json, so it would never notice on its
# own. This runs on a schedule instead - checking thousands of candidates takes 1-2+ hours, far too
# slow and too much load for the app's own hourly refresh loop or for a visitor's request to wait on.
on:
  schedule:
    - cron: "0 3 * * 0"  # every Sunday, 03:00 UTC
  workflow_dispatch:      # also runnable manually from the Actions tab
    inputs:
      limit:
        description: "Only check this many untracked candidates per pool (for a quick test run - leave empty for the real, full check)"
        required: false
        type: string
      sources:
        description: "Comma list of candidate pools to check: yc, nse (leave empty for both)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run discover.py
        run: |
          args="--refresh-candidates"
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.sources }}" ]; then args="$args --sources ${{ inputs.sources }}"; fi
          python discover.py $args
      - name: Commit and push if companies.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json yc_candidates.json yc_needs_review.json nse_candidates.json nse_needs_review.json nse_names.json
          if git diff --cached --quiet; then
            echo "Nothing new found"
            exit 0
          fi
          n=$(git diff --cached --stat companies.json | tail -1)
          git commit -m "Auto-discover: add newly-opened company job boards
          $n
          🤖 Generated by .github/workflows/discover-companies.yml"
          # prune-companies may have pushed during this multi-hour run; rebase onto it before pushing
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after 3 attempts" && exit 1
