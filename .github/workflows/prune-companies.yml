name: prune dead company boards

# The mirror image of discover-companies.yml: rechecks every company already in companies.json, and
# any with no jobs for 6 consecutive runs (twice a day = 3 days) gets moved into pruned_companies.json - so a company
# that's stopped hiring doesn't sit in the live app's list forever costing an hourly fetch for nothing.
# discover-companies.yml rechecks pruned_companies.json too, so one that starts hiring again later is
# added straight back automatically.
on:
  schedule:
    - cron: "0 4 * * *"   # every day, 04:00 UTC (9:30 AM IST)
    - cron: "0 14 * * *"  # every day, 14:00 UTC (7:30 PM IST)
  workflow_dispatch: {}   # also runnable manually from the Actions tab

permissions:
  contents: write

# Shared with discover-companies.yml so the two never run at once: both rewrite companies.json and
# pruned_companies.json, and discover runs for hours on a snapshot that would otherwise go stale.
concurrency:
  group: companies-json
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python prune.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json pruned_companies.json prune_state.json
          if git diff --cached --quiet; then
            echo "Nothing to prune"
            exit 0
          fi
          n=$(git diff --cached --stat companies.json | tail -1)
          git commit -m "Auto-prune: remove companies with no current jobs" -m "$n" -m "🤖 Generated by .github/workflows/prune-companies.yml"
          # runs are serialised by the concurrency group; this only covers unrelated pushes to the branch
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after 3 attempts" && exit 1
