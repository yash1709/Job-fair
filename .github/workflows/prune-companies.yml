name: prune dead company boards

# The mirror image of discover-companies.yml: rechecks every company already in companies.json, and
# any with no jobs for 3 consecutive daily runs gets moved into pruned_companies.json - so a company
# that's stopped hiring doesn't sit in the live app's list forever costing an hourly fetch for nothing.
# discover-companies.yml rechecks pruned_companies.json too, so one that starts hiring again later is
# added straight back automatically.
on:
  schedule:
    - cron: "0 4 * * *"  # every day, 04:00 UTC
  workflow_dispatch: {}   # also runnable manually from the Actions tab

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python prune.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json pruned_companies.json prune_state.json
          if git diff --cached --quiet; then
            echo "Nothing to prune"
            exit 0
          fi
          n=$(git diff --cached --stat companies.json | tail -1)
          git commit -m "Auto-prune: remove companies with no current jobs
          $n
          🤖 Generated by .github/workflows/prune-companies.yml"
          # discover-companies runs for hours and may have pushed meanwhile; rebase onto it before pushing
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after 3 attempts" && exit 1
